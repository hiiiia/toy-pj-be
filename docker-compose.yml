# 전체 서비스(DB + 백엔드 + 프론트엔드)를 한 번에 실행
#   1) cp .env.example .env  후 JWT_SECRET 등을 채운다
#   2) docker compose up -d --build
#   3) http://localhost:3000 접속
#
# 프론트엔드는 옆 폴더(../yh-fe)에서 빌드한다.
name: yh-helpdesk

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yh_toy
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5433}:5432" # 로컬에 설치된 PostgreSQL(5432)과 겹치지 않도록 5433 으로 노출
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d yh_toy"]
      interval: 5s
      retries: 10

  backend:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/yh_toy
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:?.env 에 JWT_SECRET 을 설정하세요 (openssl rand -base64 32)}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false} # http://localhost 로 테스트하므로 false. HTTPS 운영 시 true
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SEED_DATA: ${SEED_DATA:-true}
      CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-3000}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    ports:
      - "${API_PORT:-8081}:8080" # Swagger 확인용 (IntelliJ 로 띄운 8080 과 겹치지 않도록 8081)
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ../yh-fe
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
