# 운영(Docker) 설정. 비밀값은 모두 환경변수로 주입하고, 기본값을 두지 않아 누락 시 기동 단계에서 실패하게 한다.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}

# HTTPS 환경에서만 refresh token 쿠키를 전송
jwt.cookie-secure=${JWT_COOKIE_SECURE:true}

# 리버스 프록시(nginx)가 전달한 X-Forwarded-* 헤더로 원래 요청 주소를 인식
server.forward-headers-strategy=framework

# 운영에서는 API 문서를 끈다 (필요하면 SWAGGER_ENABLED=true)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
