spring.application.name=toy-pj
spring.profiles.default=local

# ===== DB =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/yh_toy}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ===== JPA =====
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.data.web.pageable.max-page-size=100
spring.jpa.hibernate.ddl-auto=validate

# ===== Flyway =====
spring.flyway.locations=classpath:db/migration

# ===== Security / JWT =====
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
jwt.secret=${JWT_SECRET:}
jwt.access-token-ttl=30m
jwt.refresh-token-ttl=14d
jwt.cookie-secure=${JWT_COOKIE_SECURE:false}

# ===== Auth policy =====
app.auth.max-login-attempts=5
app.auth.lock-duration=15m

# ===== App =====
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.seed-data=${SEED_DATA:false}

# ===== Attachment =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.storage.local-dir=${STORAGE_DIR:./data/uploads}
app.attachment.max-size=5MB
app.attachment.max-per-ticket=10

# ===== Notification =====
app.notification.slack-webhook-url=${SLACK_WEBHOOK_URL:}
app.notification.sla-warning-before=1h
app.notification.sla-check-interval=PT5M

# ===== Gemini =====
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.connect-timeout=3s
gemini.read-timeout=20s

# ===== Actuator / API Docs =====
management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# ===== Logging =====
# 요청 ID 가 있을 때만 [requestId] 를 붙인다 (서버 시작 로그 등에는 빈 [] 가 찍히지 않도록)
logging.pattern.correlation=%replace([%X{requestId}] ){'\\[\\] ', ''}
