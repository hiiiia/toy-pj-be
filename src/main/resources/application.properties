spring.application.name=toy-pj
spring.profiles.default=local

# ===== DB =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/yh_toy}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ===== JPA =====
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.data.web.pageable.max-page-size=100
spring.jpa.hibernate.ddl-auto=validate

# ===== Flyway =====
spring.flyway.locations=classpath:db/migration

# ===== Security / JWT =====
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
jwt.secret=${JWT_SECRET:}
jwt.access-token-ttl=30m
jwt.refresh-token-ttl=14d
jwt.cookie-secure=${JWT_COOKIE_SECURE:false}

# ===== App =====
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.seed-data=${SEED_DATA:false}

# ===== Gemini =====
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.connect-timeout=3s
gemini.read-timeout=20s

# ===== Actuator / API Docs =====
management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
