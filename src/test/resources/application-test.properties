# DB 는 Testcontainers 가 띄운 PostgreSQL 에 자동 연결된다. (PostgresTestContainer, @ServiceConnection)
# 운영과 같은 DB·같은 Flyway 마이그레이션으로 테스트하고, Hibernate 는 엔티티와 스키마가 일치하는지 검증만 한다.
spring.jpa.hibernate.ddl-auto=validate

jwt.secret=dGVzdC1vbmx5LWp3dC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RzLTEyMzQ1Ng==
app.seed-data=false

# 테스트 도중 주기 작업이 끼어들지 않도록 끈다 (SLA 점검은 테스트에서 직접 호출)
app.scheduling.enabled=false

app.storage.local-dir=${java.io.tmpdir}/yh-toy-test-uploads

# 테스트에서는 외부 AI 를 호출하지 않는다 (키워드 규칙 분류로 동작)
gemini.api-key=
