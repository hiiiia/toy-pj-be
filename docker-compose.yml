# 로컬 개발용 PostgreSQL. 실행: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: yh-toy-postgres
    environment:
      POSTGRES_DB: yh_toy
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yh_toy"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
