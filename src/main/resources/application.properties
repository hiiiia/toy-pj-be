spring.application.name=toy-pj
spring.profiles.default=local

# ===== DB =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/yh_toy}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ===== JPA =====
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.data.web.pageable.max-page-size=100
spring.jpa.hibernate.ddl-auto=validate

# ===== Flyway =====
spring.flyway.locations=classpath:db/migration

# ===== Security / JWT =====
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
jwt.secret=${JWT_SECRET:}
jwt.access-token-ttl=30m
jwt.refresh-token-ttl=14d
jwt.cookie-secure=${JWT_COOKIE_SECURE:false}

# ===== Auth policy =====
app.auth.max-login-attempts=5
app.auth.lock-duration=15m

# ===== App =====
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.seed-data=${SEED_DATA:false}

# ===== Attachment =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.storage.local-dir=${STORAGE_DIR:./data/uploads}
app.attachment.max-size=5MB
app.attachment.max-per-ticket=10

# ===== Notification =====
app.notification.slack-webhook-url=${SLACK_WEBHOOK_URL:}
app.notification.sla-warning-before=1h
app.notification.sla-check-interval=PT5M

# ===== Gemini =====
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.connect-timeout=3s
gemini.read-timeout=20s

# ===== Actuator / API Docs =====
management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# ===== Logging =====
# 요청 ID 가 있을 때만 [requestId] 를 붙인다 (서버 시작 로그 등에는 빈 [] 가 찍히지 않도록)
logging.pattern.correlation=%replace([%X{requestId}] ){'\\[\\] ', ''}

# ===== SNS 로그인 =====
# 실제 값은 환경변수로 넣는다. 기본값(local-dummy)은 테스트·CI 에서 앱이 뜨게 하기 위한 가짜 값
# 콜백 주소({baseUrl}/login/oauth2/code/{registrationId})는 각 개발자 콘솔에 등록해야 한다.
#   개발: http://localhost:5173/login/oauth2/code/{google|kakao|naver}  (Vite 프록시 경유)
#   Docker: http://localhost:3000/login/oauth2/code/{google|kakao|naver}  (nginx 경유)

# Google (provider 정보는 Spring 에 내장)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:local-dummy}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:local-dummy}
spring.security.oauth2.client.registration.google.scope=profile,email

# Kakao (Spring 이 모르는 제공자라 provider 주소를 직접 지정)
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:local-dummy}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:local-dummy}
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# Naver (사용자 정보가 response 안에 들어 있다)
spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID:local-dummy}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET:local-dummy}
spring.security.oauth2.client.registration.naver.client-name=Naver
spring.security.oauth2.client.registration.naver.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.naver.scope=name,email
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

# 로그인 후 돌아갈 프론트 주소. 상대 경로면 요청이 들어온 주소(프록시를 거친 프론트 주소) 기준으로 이동한다.
app.oauth.success-redirect-url=${OAUTH_SUCCESS_REDIRECT_URL:/oauth/callback}
app.oauth.failure-redirect-url=${OAUTH_FAILURE_REDIRECT_URL:/login}
