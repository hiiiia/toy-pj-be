spring.application.name=toy-pj
# 별도 프로필을 지정하지 않으면 local 프로필로 실행
spring.profiles.default=local

# ===== JPA =====
# OSIV 비활성화: 트랜잭션 밖(뷰/직렬화 단계)에서 지연 로딩 쿼리가 발생하지 않도록 한다
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.data.web.pageable.max-page-size=100

# ===== CORS =====
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ===== Gemini (키는 반드시 환경변수로 주입) =====
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.connect-timeout=3s
gemini.read-timeout=20s

# ===== Actuator / API Docs =====
management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
